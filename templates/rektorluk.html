<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rektörlük | İLMEK</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ios-bg: #F2F2F7; --ios-card: #FFFFFF; --ios-text: #000000;
            --ios-subtext: #8E8E93; --ios-border: #E5E5EA; --ios-input: #F2F2F7;
            --gold: #b8924e; --blue: #007AFF; --green: #34C759; --red: #FF3B30;
            --radius: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ios-bg: #000000; --ios-card: #1C1C1E; --ios-text: #FFFFFF;
                --ios-subtext: #98989D; --ios-border: #38383A; --ios-input: #2C2C2E;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: var(--ios-bg); color: var(--ios-text); }
        a { text-decoration: none; color: inherit; }

        .header {
            position: sticky; top: 0; z-index: 100; background: var(--ios-bg); backdrop-filter: blur(20px);
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .back-btn { color: var(--blue); font-size: 1rem; display: flex; align-items: center; gap: 5px; font-weight: 500; }
        .page-title { font-weight: 700; font-size: 1.1rem; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .section-header { font-size: 0.8rem; text-transform: uppercase; color: var(--ios-subtext); margin: 25px 0 8px 15px; font-weight: 600; letter-spacing: 0.5px; }

        .ios-list { background: var(--ios-card); border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .ios-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--ios-border); transition: 0.2s; cursor: pointer; }
        .ios-row:last-child { border-bottom: none; }
        
        .row-icon { width: 32px; height: 32px; border-radius: 8px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; margin-right: 15px; flex-shrink: 0; }
        .icon-green { background: var(--green); }
        .icon-blue { background: var(--blue); }
        .icon-orange { background: #FF9500; }

        .row-content { flex: 1; display: flex; flex-direction: column; }
        .row-label { font-size: 1rem; font-weight: 500; }
        .row-sub { font-size: 0.85rem; color: var(--ios-subtext); margin-top: 2px; }

        .form-list { background: var(--ios-card); border-radius: var(--radius); padding: 5px 0; }
        .input-row { padding: 10px 16px; border-bottom: 1px solid var(--ios-border); display: flex; align-items: center; }
        .input-row:last-child { border-bottom: none; }
        .input-label { width: 100px; font-weight: 500; font-size: 1rem; }
        .input-field { flex: 1; border: none; background: transparent; font-size: 1rem; padding: 5px 0; color: var(--ios-text); font-family: inherit; }

        .submit-btn { margin-top: 25px; width: 100%; padding: 16px; background: var(--gold); color: #000; font-weight: 600; font-size: 1.05rem; border: none; border-radius: var(--radius); cursor: pointer; box-shadow: 0 4px 12px rgba(184, 146, 78, 0.3); transition: 0.2s; }
        .submit-btn:active { transform: scale(0.98); opacity: 0.9; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 1000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-card { background: var(--ios-card); width: 80%; max-width: 320px; border-radius: 20px; padding: 30px 20px; text-align: center; }
        .modal-icon { width: 60px; height: 60px; background: var(--gold); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 15px; }
        .track-box { background: var(--ios-input); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; margin: 15px 0; letter-spacing: 2px; }

        .signature { text-align: center; margin-top: 40px; font-family: 'Dancing Script', cursive; font-size: 1.3rem; color: var(--gold); opacity: 0.7; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i> Geri</a>
        <div class="page-title">Rektörlük İletişim</div>
        <div style="width:50px;"></div>
    </div>

    <div class="container">
        <div class="section-header">RESMİ İLETİŞİM KANALLARI</div>
        <div class="ios-list">
            <a href="tel:04122411000" class="ios-row">
                <div class="row-icon icon-green"><i class="fa-solid fa-phone"></i></div>
                <div class="row-content"><div class="row-label">Santral</div><div class="row-sub">0412 241 10 00</div></div>
            </a>
            <div class="ios-row" onclick="copyText('dicleuniversitesi@hs01.kep.tr')">
                <div class="row-icon icon-orange"><i class="fa-solid fa-at"></i></div>
                <div class="row-content"><div class="row-label">KEP Adresi</div><div class="row-sub">dicleuniversitesi@hs01.kep.tr</div></div>
            </div>
        </div>

        <div class="section-header">ONLINE DİLEKÇE & ÖNERİ</div>
        <form id="rektForm" onsubmit="sendForm(event)">
            <div class="form-list">
                <div class="input-row">
                    <div class="input-label">Ad Soyad</div>
                    <input type="text" id="senderName" class="input-field" placeholder="örn: AHMET YILMAZ" required>
                </div>
                <div class="input-row">
                    <div class="input-label">Konu</div>
                    <select id="subject" class="input-field" required>
                        <option value="">Seçiniz</option>
                        <option value="İstek / Dilek">İstek / Dilek</option>
                        <option value="Şikayet">Şikayet</option>
                        <option value="Öneri">Öneri</option>
                        <option value="Randevu Talebi">Randevu Talebi</option>
                    </select>
                </div>
            </div>

            <div class="section-header" style="margin-top: 15px;">MESAJINIZ</div>
            <div class="form-list">
                <div class="input-row" style="align-items: flex-start;">
                    <textarea id="content" class="input-field" placeholder="Talebinizi detaylı ifade ediniz..." required></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Başvuruyu Gönder</button>
        </form>

        <div class="signature">Design by İhsanoğlu</div>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <div class="modal-icon"><i class="fa-solid fa-check"></i></div>
            <h3 style="margin:0 0 10px 0;">Kaydınız Oluşturuldu</h3>
            <p style="font-size:0.9rem; color:var(--ios-subtext); margin:0;">Takip kodunuz:</p>
            <div class="track-box" id="trackCode">#DÜ-9999</div>
            <button onclick="window.location.href='index.html'" style="background:var(--ios-bg); border:none; padding:12px 30px; border-radius:10px; color:var(--blue); font-weight:600; cursor:pointer;">Tamam</button>
        </div>
    </div>

    <script>
        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert("Kopyalandı: " + text);
        }

        // --- BACKEND BAĞLANTISI ---
        async function sendForm(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const senderName = document.getElementById('senderName').value;
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('content').value;

            // Görsel yükleniyor durumu
            btn.innerText = "Gönderiliyor...";
            btn.disabled = true;

            try {
                // API isteği gönderiliyor
                const response = await fetch('https://ilmek-backend.onrender.com/api/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senderName, subject, content })
                });

                if(response.ok) {
                    // Başarı kodu üret ve modalı aç
                    const code = "#DÜ-" + Math.floor(1000 + Math.random() * 9000);
                    document.getElementById('trackCode').innerText = code;
                    document.getElementById('successModal').classList.add('active');
                    document.getElementById('rektForm').reset();
                } else {
                    alert("Mesaj iletilemedi, lütfen tekrar deneyin.");
                }
            } catch (err) {
                alert("Sunucuya bağlanılamadı! (node server.js açık mı?)");
            } finally {
                btn.innerText = "Başvuruyu Gönder";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
