<!DOCTYPE html>
<html lang="tr">
<head>
    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'auth.html'; }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sohbet Odası | İLMEK</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #050505; --bg-card: #1C1C1E; --text-primary: #F5F5F7;
            --text-secondary: #86868B; --gold: #b8924e; --radius: 20px;
            --glass: rgba(255, 255, 255, 0.05); --mention-bg: rgba(184, 146, 78, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-primary); overflow: hidden; }

        /* HEADER */
        .chat-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }
        .back-btn { font-size: 1.2rem; color: var(--gold); cursor: pointer; }
        .chat-title { font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 1px; color: #fff; text-align: center; }
        .chat-status { font-size: 0.6rem; color: #34C759; margin-top: 2px; font-family: 'Inter', sans-serif; display: block; }

        /* CHAT AREA */
        .chat-container {
            height: 100vh; display: flex; flex-direction: column; padding-top: 70px; padding-bottom: 80px;
        }
        .messages-area {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }
        
        /* MESAJ BALONLARI */
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; position: relative; animation: popIn 0.2s ease; word-wrap: break-word; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Gelen Mesaj (Sol) */
        .msg.received {
            align-self: flex-start; background: #262628; color: #fff;
            border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Giden Mesaj (Sağ - Benim) */
        .msg.sent {
            align-self: flex-end; background: var(--gold); color: #000;
            border-bottom-right-radius: 4px; font-weight: 500;
            box-shadow: 0 4px 15px rgba(184, 146, 78, 0.2);
        }

        /* BAHSEDİLME (MENTION) STİLİ */
        .msg.mentioned {
            background: var(--mention-bg); border: 1px solid var(--gold);
            box-shadow: 0 0 15px rgba(184, 146, 78, 0.1);
        }
        .mention-tag { color: #FFD700; font-weight: bold; background: rgba(0,0,0,0.2); padding: 0 4px; border-radius: 4px; }
        .msg.sent .mention-tag { color: #000; background: rgba(255,255,255,0.3); }

        /* Kullanıcı Adı ve Zaman */
        .sender-name { 
            font-size: 0.75rem; color: var(--gold); margin-bottom: 4px; display: block; font-weight: 700; 
            cursor: pointer; transition: 0.2s;
        }
        .sender-name:hover { text-decoration: underline; color: #fff; } /* Tıklanabilir hissi */
        
        .msg-time { font-size: 0.65rem; margin-top: 4px; opacity: 0.6; text-align: right; display: block; }
        .msg.sent .msg-time { color: #000; }

        /* INPUT AREA */
        .input-area {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
            background: #111; border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; padding: 0 15px; gap: 10px;
            padding-bottom: env(safe-area-inset-bottom); z-index: 100;
        }
        
        .chat-input {
            flex: 1; background: #262628; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px 15px; border-radius: 25px; font-size: 1rem;
            font-family: 'Inter', sans-serif; transition: 0.3s;
        }
        .chat-input:focus { border-color: var(--gold); background: #333; }

        .send-btn {
            width: 45px; height: 45px; background: var(--gold); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000;
            font-size: 1.2rem; cursor: pointer; border: none; transition: 0.2s;
        }
        .send-btn:active { transform: scale(0.9); }

    </style>
</head>
<body>

    <div class="chat-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="chat-title">
            KAMPÜS FORUMU
            <span class="chat-status">● Çevrimiçi</span>
        </div>
        <div style="width: 20px;"></div>
    </div>

    <div class="chat-container">
        <div class="messages-area" id="messagesList">
            <div style="text-align:center; color:#555; font-size:0.8rem; margin-top:50px;">Sohbet yükleniyor...</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" class="chat-input" placeholder="Bir şeyler yaz..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script>
        const API_URL = 'https://ilmek-backend.onrender.com/api';
        
        // Giriş sırasında localStorage'a kaydedilen 'username'i kullan. 
        // Eğer yoksa fallback olarak fullName kullan.
        const myUsername = localStorage.getItem('username') || "Anonim"; 
        const myFullName = localStorage.getItem('fullName');

        const msgList = document.getElementById('messagesList');
        const msgInput = document.getElementById('msgInput');
        let lastMsgCount = 0;

        // --- 1. MESAJLARI ÇEK VE GÖSTER ---
        async function fetchMessages() {
            try {
                const res = await fetch(`${API_URL}/chat/all`);
                const messages = await res.json();

                if (messages.length === lastMsgCount) return;
                
                lastMsgCount = messages.length;
                msgList.innerHTML = ''; 

                messages.forEach(msg => {
                    const isMe = msg.sender === myUsername; // Kullanıcı adıyla kontrol
                    const time = new Date(msg.timestamp).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    
                    // Mention Kontrolü: Mesajın içinde "@benimKullaniciAdim" geçiyor mu?
                    const isMentioned = msg.text.includes('@' + myUsername);
                    const msgClass = isMe ? 'sent' : (isMentioned ? 'received mentioned' : 'received');

                    // Metin içindeki etiketleri renklendir (Regex)
                    // Örnek: @ahmet -> <span class="mention-tag">@ahmet</span>
                    const formattedText = msg.text.replace(/@(\w+)/g, '<span class="mention-tag">@$1</span>');

                    const html = `
                        <div class="msg ${msgClass}">
                            ${!isMe ? `<span class="sender-name" onclick="addMention('${msg.sender}')">@${msg.sender}</span>` : ''}
                            ${formattedText}
                            <span class="msg-time">${time}</span>
                        </div>
                    `;
                    msgList.innerHTML += html;
                });

                // Eğer mention yemişsen titret (Mobilde)
                const lastMsg = messages[messages.length - 1];
                if (lastMsg && !lastMsg.isMe && lastMsg.text.includes('@' + myUsername)) {
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }

                msgList.scrollTop = msgList.scrollHeight;

            } catch (err) { console.error("Chat hatası"); }
        }

        // --- 2. MESAJ GÖNDER ---
        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // Anlık UI (Hız hissi için)
            // Kendi mesajımızda da mentionları boyayalım
            const formattedText = text.replace(/@(\w+)/g, '<span class="mention-tag">@$1</span>');
            
            const tempHtml = `
                <div class="msg sent" style="opacity:0.5">
                    ${formattedText}
                    <span class="msg-time">Gönderiliyor...</span>
                </div>
            `;
            msgList.innerHTML += tempHtml;
            msgList.scrollTop = msgList.scrollHeight;
            msgInput.value = '';

            try {
                // Gönderirken 'sender' olarak 'myUsername' kullanıyoruz
                await fetch(`${API_URL}/chat/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: myUsername, text: text })
                });
                
                fetchMessages(); 
            } catch (err) {
                alert("Mesaj gönderilemedi!");
            }
        }

        // --- 3. HIZLI ETİKETLEME ---
        // Kullanıcı adına tıklayınca input'a @kullaniciadi ekler
        function addMention(username) {
            msgInput.value += `@${username} `;
            msgInput.focus();
        }

        msgInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });

        // Başlat
        fetchMessages();
        setInterval(fetchMessages, 3000); 

    </script>
</body>
</html>
