<!DOCTYPE html>
<html lang="tr">
<head>
    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'auth.html'; }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>İyilik İçin İzle | İLMEK</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #050505; --bg-card: #1C1C1E; --text-primary: #F5F5F7;
            --text-secondary: #86868B; --gold: #b8924e; --radius: 20px;
            --sidebar-width: 280px; --red: #ff4d4d; --green: #34C759;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-primary); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* --- LAYOUT & SIDEBAR --- */
        .layout-grid { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }
        .sidebar { background: var(--bg-body); border-right: 1px solid rgba(128,128,128,0.1); padding: 40px 30px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .brand { font-family: 'Cinzel', serif; font-size: 1.6rem; margin-bottom: 50px; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 15px; border-radius: 12px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 15px; margin-bottom: 5px; transition: 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(184, 146, 78, 0.1); color: var(--gold); }

        /* --- MOBİL HEADER --- */
        .fixed-header { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); display: none; 
        }
        @media (max-width: 1024px) { .fixed-header { display: flex; } .sidebar { display: none; } .layout-grid { display: block; } }
        
        .back-btn { display: flex; align-items: center; gap: 8px; color: var(--gold); font-weight: 600; padding: 8px 12px; border-radius: 12px; background: rgba(184, 146, 78, 0.1); }
        .logo-text { font-family: 'Cinzel', serif; font-size: 1.1rem; color: #fff; letter-spacing: 2px; }

        /* --- BİLDİRİM KUTUSU (TOAST) --- */
        #custom-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(52, 199, 89, 0.95); color: #fff; padding: 15px 30px;
            border-radius: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            z-index: 10000; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.9rem;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); opacity: 0;
        }
        #custom-toast.show { transform: translateX(-50%) translateY(50px); opacity: 1; }

        /* --- SAYFA İÇERİĞİ --- */
        .main-content { padding: 40px 60px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 1024px) { .main-content { padding: 90px 20px 120px 20px; } }

        .section-title { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--gold); text-align: center; margin-bottom: 10px; text-shadow: 0 0 20px rgba(184, 146, 78, 0.3); }
        .section-desc { text-align: center; color: var(--text-secondary); margin-bottom: 40px; font-size: 0.9rem; }

        .video-wrapper {
            position: relative; width: 100%; padding-bottom: 56.25%; background: #000; 
            border-radius: 20px; overflow: hidden; box-shadow: 0 0 50px rgba(184, 146, 78, 0.15); 
            border: 1px solid rgba(184, 146, 78, 0.3); margin-bottom: 30px;
        }
        .video-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--gold); box-shadow: 0 0 15px var(--gold); transition: width 1s linear; }

        .action-area { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .timer-text { font-family: 'Inter', sans-serif; font-weight: 700; color: var(--text-secondary); }
        .timer-text span { color: var(--gold); }

        .btn-confirm {
            background: linear-gradient(135deg, #333 0%, #111 100%); color: #555; border: 1px solid #444;
            padding: 15px 40px; border-radius: 15px; font-weight: 800; letter-spacing: 1px;
            cursor: not-allowed; transition: 0.3s; width: 100%; max-width: 300px; text-transform: uppercase;
        }
        .btn-confirm.active {
            background: linear-gradient(135deg, var(--gold) 0%, #8E7035 100%); color: #000; border-color: var(--gold);
            cursor: pointer; box-shadow: 0 0 30px rgba(184, 146, 78, 0.4); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 40px; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; text-align: center; }
        .stat-val { font-family: 'Cinzel', serif; font-size: 1.8rem; color: #fff; margin-bottom: 5px; }
        .stat-label { color: var(--text-secondary); font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; }

        .dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(20px); padding: 12px 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; gap: 25px; align-items: center; border: 1px solid rgba(255,255,255,0.1); z-index: 999; width: max-content; }
        @media (min-width: 1025px) { .dock { display: none; } }
        .dock-item { color: #888; font-size: 1.4rem; transition: 0.3s; }
        .dock-item.active { color: var(--gold); transform: translateY(-3px); }
    </style>
</head>
<body>

    <div id="custom-toast"><i class="fas fa-check-circle"></i> Allah Kabul Etsin!</div>

    <div class="fixed-header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> GERİ</a>
        <div class="logo-text">İYİLİK TV</div>
        <div style="width: 30px;"></div> 
    </div>

    <div class="layout-grid">
        <aside class="sidebar">
            <div class="brand"><i class="fa-solid fa-knot" style="color:var(--gold)"></i> İLMEK</div>
            <nav style="flex: 1;">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
                <a href="duyurular.html" class="nav-item"><i class="fa-solid fa-bullhorn"></i> Duyurular</a>
                <a href="sohbet.html" class="nav-item"><i class="fa-solid fa-comments"></i> Sohbet Odası</a>
                <a href="ilmek_ana_ders_portal.html" class="nav-item" style="color:var(--gold)"><i class="fa-solid fa-graduation-cap"></i> Ders Portalı</a>
                <a href="reklam_izle.html" class="nav-item active" style="color:var(--gold)"><i class="fa-solid fa-play"></i> İyilik İçin İzle</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="section-title">İYİLİK SİNEMASI</h1>
            <p class="section-desc">Her izlediğin video, ihtiyaç sahibi bir öğrenciye umut oluyor. <br>Lütfen videoyu sonuna kadar izle.</p>

            <div class="video-wrapper">
                <iframe class="video-iframe" 
                    src="https://www.youtube.com/embed/qRTVg8HHzUo?enablejsapi=1&controls=0&rel=0&autoplay=1&mute=1&loop=1&playlist=qRTVg8HHzUo" 
                    title="İyilik İçin İzle" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="p-bar"></div>
            </div>

            <div class="action-area">
                <div class="timer-text" id="status-text">Kalan Süre: <span>15 Saniye</span></div>
                <button id="claim-btn" class="btn-confirm" onclick="claimReward()">BAĞIŞI ONAYLA</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" style="color:var(--gold)">₺<span id="user-total">0.00</span></div>
                    <div class="stat-label">Senin Katkın</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val">₺<span id="global-total">...</span></div>
                    <div class="stat-label">Genel Havuz</div>
                </div>
            </div>
        </main>
    </div>

    <div class="dock">
        <a href="index.html" class="dock-item"><i class="fa-solid fa-house"></i></a>
        <a href="ilmek_ana_ders_portal.html" class="dock-item"><i class="fa-solid fa-compass"></i></a>
        <a href="sohbet.html" class="dock-item"><i class="fa-solid fa-comments"></i></a>
        <a href="reklam_izle.html" class="dock-item active"><i class="fa-solid fa-play"></i></a>
    </div>

    <script>
        const API_URL = 'https://ilmek-backend.onrender.com/api';
        
        let timeLeft = 15;
        const progressBar = document.getElementById('p-bar');
        const statusText = document.getElementById('status-text');
        const claimBtn = document.getElementById('claim-btn');
        const userTotalEl = document.getElementById('user-total');
        const globalTotalEl = document.getElementById('global-total');
        const toast = document.getElementById('custom-toast');

        // Kullanıcının kişisel bakiyesini yerelden çek
        let currentDonation = parseFloat(localStorage.getItem('myDonation')) || 0.00;
        userTotalEl.innerText = currentDonation.toFixed(2);

        // Sayfa Açılınca: GENEL HAVUZU ÇEK
        async function fetchPool() {
            try {
                const res = await fetch(`${API_URL}/stats/pool`);
                const data = await res.json();
                globalTotalEl.innerText = data.total.toFixed(2);
            } catch (err) {
                console.error("Havuz verisi alınamadı");
                globalTotalEl.innerText = "1240.00"; // Fallback
            }
        }
        window.onload = fetchPool; // Sayfa yüklenince çalıştır

        // Geri Sayım
        const timer = setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                const percentage = ((15 - timeLeft) / 15) * 100;
                progressBar.style.width = percentage + "%";
                statusText.innerHTML = `Kalan Süre: <span>${timeLeft} Saniye</span>`;
            } else {
                clearInterval(timer);
                completeWatch();
            }
        }, 1000);

        function completeWatch() {
            progressBar.style.width = "100%";
            statusText.innerHTML = "<span style='color:var(--green)'>Süre Tamamlandı!</span>";
            claimBtn.classList.add('active');
            claimBtn.innerText = "BAĞIŞI KUMBARAYA AT";
            claimBtn.disabled = false;
        }

        function showToast(msg) {
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function claimReward() {
            if(claimBtn.classList.contains('active')) {
                // 1. UI Güncelle (Hemen)
                claimBtn.innerText = "İŞLENİYOR...";
                claimBtn.disabled = true;
                claimBtn.classList.remove('active');

                try {
                    // 2. BACKEND'E İSTEK AT (Havuza Ekle)
                    const res = await fetch(`${API_URL}/stats/pool/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    const data = await res.json();

                    // 3. UI Başarılı
                    claimBtn.innerText = "KUMBARAYA EKLENDİ";
                    claimBtn.style.background = "var(--green)";
                    claimBtn.style.color = "#fff";
                    claimBtn.style.border = "none";

                    // 4. Kişisel Bakiyeyi Artır (0.05 TL)
                    currentDonation += 0.05;
                    userTotalEl.innerText = currentDonation.toFixed(2);
                    localStorage.setItem('myDonation', currentDonation);

                    // 5. Global Bakiyeyi Güncelle (Backend'den gelen yeni veri)
                    if(data.total) {
                        globalTotalEl.innerText = data.total.toFixed(2);
                    }

                    // 6. Bildirim & Yenileme
                    showToast("Allah kabul etsin! 5 Krş eklendi.");
                    
                    setTimeout(() => {
                        location.reload(); 
                    }, 2500);

                } catch (err) {
                    console.error("Bağış hatası:", err);
                    claimBtn.innerText = "HATA OLUŞTU";
                    claimBtn.style.background = "var(--red)";
                }
            }
        }
    </script>
</body>
</html>
