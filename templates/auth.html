<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İLMEK | Giriş Kapısı</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg: #050505; --gold: #b8924e; --gold-glow: rgba(184, 146, 78, 0.3);
            --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text: #F5F5F7;
        }

        body {
            margin: 0; padding: 0; background: var(--bg);
            font-family: 'Inter', sans-serif; color: var(--text);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        #canvas-bg { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

        .auth-wrapper { width: 100%; max-width: 400px; padding: 20px; z-index: 10; animation: fadeIn 1.2s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .brand-section { text-align: center; margin-bottom: 40px; }
        .brand-logo { font-family: 'Cinzel', serif; font-size: 3.2rem; letter-spacing: 12px; color: var(--gold); text-shadow: 0 0 30px var(--gold-glow); }
        .brand-sub { font-size: 0.7rem; letter-spacing: 4px; color: var(--gold); opacity: 0.6; margin-top: 10px; font-weight: 600; }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        /* BİLDİRİM STİLİ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .tabs { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 15px; margin-bottom: 30px; }
        .tab { padding: 12px; text-align: center; cursor: pointer; border-radius: 12px; font-weight: 700; font-size: 0.8rem; transition: 0.4s; color: rgba(255,255,255,0.4); }
        .tab.active { background: var(--gold); color: #000; box-shadow: 0 4px 15px var(--gold-glow); }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group i { position: absolute; left: 18px; top: 18px; color: var(--gold); opacity: 0.7; font-size: 0.9rem; }
        
        input {
            width: 100%; padding: 16px 16px 16px 50px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 16px; color: #fff;
            font-size: 0.95rem; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; background: rgba(255,255,255,0.1); border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-glow); }

        .submit-btn {
            width: 100%; padding: 18px; background: linear-gradient(135deg, #b8924e 0%, #8E7035 100%);
            color: #000; border: none; border-radius: 16px; font-weight: 800; font-size: 0.9rem;
            letter-spacing: 1px; cursor: pointer; transition: 0.4s; margin-top: 10px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px var(--gold-glow); }

        #register-form { display: none; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.65rem; color: rgba(255,255,255,0.3); letter-spacing: 2px; }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="auth-wrapper">
        <div class="brand-section">
            <div class="brand-logo">İLMEK</div>
            <div class="brand-sub">MEGA PORTAL ACCESS</div>
        </div>

        <div class="glass-card">
            <div id="auth-notification" style="display: none; background: rgba(255, 59, 48, 0.15); border: 1px solid rgba(255, 59, 48, 0.3); color: #FF3B30; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.85rem; text-align: center; font-weight: 600; animation: shake 0.4s ease-in-out;"></div>

            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="toggleAuth('login')">GİRİŞ YAP</div>
                <div class="tab" id="tab-register" onclick="toggleAuth('register')">KAYIT OL</div>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="login-id" placeholder="E-posta, Telefon veya Kullanıcı Adı" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-pass" placeholder="Şifre" required>
                </div>
                <button type="submit" class="submit-btn">SİSTEME BAĞLAN</button>
            </form>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="input-group"><i class="fa-solid fa-signature"></i><input type="text" id="reg-name" placeholder="Ad Soyad" required></div>
                <div class="input-group"><i class="fa-solid fa-envelope"></i><input type="email" id="reg-mail" placeholder="E-posta" required></div>
                <div class="input-group"><i class="fa-solid fa-phone"></i><input type="tel" id="reg-phone" placeholder="Telefon" required></div>
                <div class="input-group"><i class="fa-solid fa-key"></i><input type="password" id="reg-pass" placeholder="Şifre" required></div>
                <button type="submit" class="submit-btn">AİLEYE KATIL</button>
            </form>
        </div>
        <div class="footer">İLMEK TECH. &bull; 2026</div>
    </div>

    <script>
        const API = 'https://ilmek-backend.onrender.com/api/auth';

        // --- HATA GÖSTERİM SİSTEMİ ---
        function showAuthError(message) {
            const notify = document.getElementById('auth-notification');
            notify.innerText = message;
            notify.style.display = 'block';
            
            setTimeout(() => {
                notify.style.display = 'none';
            }, 4000);
        }

        // --- GÖRSEL EFEKT SİSTEMİ (ALTIN SİM TOZLARI) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i=0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 10; }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0xb8924e, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 2;

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            renderer.render(scene, camera);
        }
        animate();

        function toggleAuth(mode) {
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        }

        // --- YENİ UYUMLU LOGIN FONKSİYONU ---
        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-id').value;
            const password = document.getElementById('login-pass').value;

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        identifier: identifier, 
                        password: password 
                    })
                });
                
                const data = await res.json();
                
                if(res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('fullName', data.fullName);
                    localStorage.setItem('username', data.username);
                    window.location.href = 'index.html';
                } else { 
                    showAuthError(data.error); 
                }
            } catch (err) { 
                showAuthError("Sunucu şu an kapalı veya ulaşılamıyor!"); 
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const formData = {
                fullName: document.getElementById('reg-name').value,
                email: document.getElementById('reg-mail').value,
                phone: document.getElementById('reg-phone').value,
                password: document.getElementById('reg-pass').value
            };

            try {
                const res = await fetch(`${API}/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                if(res.ok) { 
                    showAuthError("✅ Kayıt başarılı! Şimdi giriş yapabilirsiniz."); 
                    toggleAuth('login'); 
                }
                else { 
                    showAuthError(data.error); 
                }
            } catch (err) { 
                showAuthError("Kayıt işlemi başarısız!"); 
            }
        }
    </script>
</body>
</html>
